# Repo-level tooling config only. This is not a package: each skill is a
# standalone directory with its own requirements.txt and .venv, and nothing here
# is ever built or published.

[tool.ruff]
# 3.9 is the repo-wide floor -- deep-research and pst-to-markdown both run there.
# (garmin needs 3.12+, but linting it against the lower floor costs nothing and
# keeps one setting instead of per-directory overrides.)
target-version = "py39"

# Chosen to fit the code as written rather than to force a reflow. The scripts
# use long single-line prompt strings and f-string status lines; wrapping them
# would hurt readability to satisfy an arbitrary number.
line-length = 120

exclude = [
    ".venv",
    "venv",
    "**/temp_research_output",
]

[tool.ruff.lint]
# Deliberately modest. The job is to stop new rot, not to relitigate ~1,800
# lines of working script. Add rules when they earn their keep.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "W",    # pycodestyle warnings
]

ignore = [
    "E501",  # line-too-long: line-length above is advisory for the formatter,
             # not a hard gate. Flagging it here would fail CI on prompt strings
             # that cannot sensibly be split.
    "B008",  # function call in default argument -- not a pattern in this repo,
             # and the rule misfires on argparse-adjacent helpers.
]

[tool.ruff.lint.per-file-ignores]
# Test modules load their subject by path, so the sys.path.insert must run
# before the import. E402 is the correct shape here, not a mistake.
"**/tests/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["gpt_image_2", "extract_pst", "humanize_api"]

[tool.ruff.format]
quote-style = "preserve"
