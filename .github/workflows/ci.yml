name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: CI should report on the
# newest commit, not queue behind stale ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the top level so every job inherits it. Nothing here writes
# to the repo, publishes packages, or comments on PRs; without this block the
# workflow token would carry whatever the repo default happens to be.
permissions:
  contents: read

# Actions are pinned to commit SHAs rather than tags. A tag is mutable -- whoever
# controls the action repo can repoint v5 at new code, and it runs here with the
# workflow token. Dependabot keeps these pins current (see .github/dependabot.yml).
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: ruff check
        # Config lives in pyproject.toml. target-version is py39 (the repo-wide
        # floor), so ruff will not rewrite annotations into syntax that breaks
        # the oldest Python any skill supports.
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check .

  repo-hygiene:
    name: repo hygiene (frontmatter + tables + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade pip pytest

      - name: SKILL.md frontmatter and README/CLAUDE.md table sync
        # Stdlib-only on purpose: this job must be able to run before any skill's
        # dependencies are installed. Catches a skill going undiscoverable
        # (broken frontmatter) and the doc tables drifting from the directories
        # on disk -- the failure that left outlook/trello listed after they moved.
        run: python -m pytest tests/test_repo_hygiene.py -v -p no:cacheprovider

      - name: shellcheck
        # ubuntu-latest ships shellcheck. Every finding was fixed when this step
        # was added, so any output here is new.
        # ./ prefixes so a filename beginning with a dash could never be read as
        # an option (SC2035).
        run: shellcheck ./install.sh ./install-codex.sh ./tests/*.sh ./*/setup.sh ./*/scripts/setup.sh

      - name: actionlint
        # Added after this workflow's first run failed outright on a syntax error
        # GitHub only reports once the file is pushed: expressions accept single
        # quotes only, so join(needs.*.result, " ") is invalid. actionlint catches
        # that locally, and it also shellchecks every `run:` block.
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  installers:
    name: installers (parity + codex install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # 3.12 so the garmin dependency floor is satisfied if this suite ever
          # grows a garmin install case.
          python-version: '3.12'

      - name: install-codex.sh tests
        # This suite was red for months without anyone noticing: nothing ran it,
        # and it still installed `trello`, a skill extracted to its own repo in
        # Jul 2026. Wiring it into CI is what stops the installers drifting apart
        # again -- which is how gpt-image-2 and deep-research ended up
        # uninstallable for Codex.
        run: bash tests/test_install_codex.sh

  deep-research:
    name: deep-research (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor: every script carries `from __future__ import annotations`,
        # so PEP 604 syntax parses there. 3.13 is the current ceiling.
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # The skill's scripts are stdlib-only by design (requirements.txt is empty
        # apart from optional weasyprint). pytest is only needed to RUN the tests --
        # the tests themselves are plain unittest.
        run: python -m pip install --upgrade pip pytest

      - name: Run test suite
        working-directory: deep-research
        # -p no:cacheprovider keeps the checkout clean; tests are hermetic and must
        # never touch the network (the offline citation path is asserted explicitly).
        run: python -m pytest tests/ -v -p no:cacheprovider

      - name: Verify scripts are importable and stdlib-only
        working-directory: deep-research
        run: |
          for f in scripts/*.py; do
            python -c "import ast,sys; ast.parse(open('$f').read())" || exit 1
          done
          echo "All scripts parse cleanly on Python ${{ matrix.python-version }}"

  garmin:
    name: garmin (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor here, not deep-research's 3.9, and the binding
        # constraint is the dependency rather than our own code: garminconnect
        # 0.3.3+ declares Requires-Python >=3.12, so pip cannot even resolve the
        # pin below that. (The scripts' PEP 604 annotations would independently
        # require 3.10, but that limit is never the one you hit first.)
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: garmin
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run test suite
        working-directory: garmin
        # test_garmin_api_contract.py imports the real garminconnect on purpose. It
        # exists to catch an upstream auth-surface rename (.garth -> .client), which
        # mocked tests cannot see because MagicMock invents whatever attribute it is
        # asked for -- that is how the break went unnoticed for months. Still no
        # network: it only constructs Garmin() and inspects attributes, and the
        # login assertion fails on the missing tokenstore before any request.
        run: python -m pytest tests/ -v -p no:cacheprovider

  gpt-image-2:
    name: gpt-image-2 (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 floor: the script's `str | None` hints are safe below 3.10 because
        # it carries `from __future__ import annotations`, and PyYAML (its only
        # dependency) supports 3.8+. Sampled rather than swept -- floor, middle,
        # ceiling is enough to catch a syntax or stdlib regression.
        python-version: ['3.9', '3.11', '3.13']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: gpt-image-2
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r requirements.txt

      - name: Run test suite
        working-directory: gpt-image-2
        # No network: the only function that calls out is api_request, and nothing
        # in the suite reaches it. The CLI cases use --dry-run, which returns
        # before the request is built.
        run: python -m pytest tests/ -v -p no:cacheprovider
        env:
          # --dry-run still runs the API-key check first, so the CLI cases need a
          # key present. It is never sent anywhere.
          OPENAI_API_KEY: test-key-not-real

  humanize:
    name: humanize (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The script has no annotations at all, so 3.9 is comfortable. Worth
        # keeping: on 3.9 pip resolves an older `requests` than on 3.13 (the
        # current release needs >=3.10), so the two jobs exercise different
        # versions of the one dependency.
        python-version: ['3.9', '3.13']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: humanize
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r requirements.txt

      - name: Run test suite
        working-directory: humanize
        # requests and time.sleep are both patched, so the MAX_POLLS timeout case
        # runs 60 iterations instantly instead of taking five real minutes.
        run: python -m pytest tests/ -v -p no:cacheprovider

  pst-to-markdown:
    name: pst-to-markdown (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Hard 3.9 floor: parse_email_address annotates `tuple[str, str]` at
        # runtime with no `from __future__ import annotations`, so PEP 585
        # builtin generics must exist for the module to import at all.
        python-version: ['3.9', '3.11', '3.13']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # Deliberately NOT the full requirements.txt. libratom pins
        # numpy==1.23.5, which has no wheels above cp311 and cannot build on
        # 3.12+ -- installing it here would make this job unrunnable on the
        # current Python. libratom is an optional guarded import in the module,
        # and the extraction driver that uses it is out of scope for these tests
        # (it needs a real PST fixture), so the suite runs without it. The
        # full-install path is proved by the separate job below.
        run: python -m pip install --upgrade pip pytest html2text python-dateutil tqdm

      - name: Run test suite
        working-directory: pst-to-markdown
        run: python -m pytest tests/ -v -p no:cacheprovider

  pst-to-markdown-install:
    name: pst-to-markdown (full requirements, py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # 3.11 is the real ceiling for the documented install, not a preference:
          # libratom pins numpy==1.23.5, whose newest wheel is cp311. This job
          # exists so that ceiling is asserted rather than discovered by a user.
          # If it ever starts failing, libratom has moved and the README's
          # "Python 3.8-3.11" row needs revisiting.
          python-version: '3.11'

      - name: Install the full documented requirements
        working-directory: pst-to-markdown
        # setuptools and wheel go in first: libratom's transitive numpy==1.23.5
        # is an sdist here and needs a build backend present to configure.
        run: |
          python -m pip install --upgrade pip setuptools wheel pytest
          python -m pip install -r requirements.txt

      - name: libratom is importable, so the extraction path is real
        working-directory: pst-to-markdown
        run: |
          python -c "from libratom.lib.pff import PffArchive; print('libratom import OK')"
          python -c "
          import sys; sys.path.insert(0, 'scripts')
          import extract_pst
          assert extract_pst.USE_LIBRATOM, 'libratom installed but not detected'
          print('extract_pst detects libratom')
          "

      - name: Run the suite against the full dependency set
        working-directory: pst-to-markdown
        run: python -m pytest tests/ -v -p no:cacheprovider

  smoke:
    name: end-to-end smoke (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Validate the shipped fixtures with the real gates
        working-directory: deep-research
        run: |
          set -e
          echo "--- report format ---"
          python scripts/validate_report.py --report tests/fixtures/valid_report.md --format report
          python scripts/verify_citations.py --report tests/fixtures/valid_report.md --offline

          echo "--- brief format ---"
          python scripts/validate_report.py --report tests/fixtures/valid_brief.md --format brief
          python scripts/verify_citations.py --report tests/fixtures/valid_brief.md --offline

          echo "--- invalid report must FAIL ---"
          if python scripts/validate_report.py --report tests/fixtures/invalid_report.md; then
            echo "ERROR: invalid_report.md passed validation but should have failed"
            exit 1
          fi
          echo "OK: invalid report correctly rejected"

      - name: Full run lifecycle (init -> batch register -> batch evidence -> bibliography)
        working-directory: deep-research
        run: |
          set -e
          RUN=$(mktemp -d)
          python scripts/citation_manager.py init-run --out-dir "$RUN" --query "smoke test" --mode standard

          cat > "$RUN/sources_batch.jsonl" <<'EOF'
          {"raw_url": "https://www.nature.com/articles/x", "title": "A Paper", "year": "2026", "source_type": "academic"}
          {"raw_url": "https://arxiv.org/abs/2501.00001", "title": "A Preprint", "year": "2026", "source_type": "academic"}
          EOF
          python scripts/citation_manager.py register-sources --jsonl-file "$RUN/sources_batch.jsonl" --dir "$RUN"

          SID=$(python -c "import json;print(json.loads(open('$RUN/sources.jsonl').readline())['source_id'])")
          cat > "$RUN/evidence_batch.jsonl" <<EOF
          {"source_id": "$SID", "quote": "the measured latency fell by 34%", "locator": "p4", "evidence_type": "data_point"}
          EOF
          python scripts/evidence_store.py add-batch --jsonl-file "$RUN/evidence_batch.jsonl" --dir "$RUN"

          python scripts/citation_manager.py assign-display-numbers --dir "$RUN"
          python scripts/citation_manager.py export-bibliography --dir "$RUN"
          python scripts/source_evaluator.py score --jsonl-file "$RUN/sources.jsonl"

          test -s "$RUN/sources.jsonl"
          test -s "$RUN/evidence.jsonl"
          echo "OK: full lifecycle completed"

      - name: setup.sh must succeed WITHOUT the Bright Data CLI
        working-directory: deep-research
        # Bright Data is a fallback provider, not a requirement: the skill runs on the
        # host's built-in WebSearch/WebFetch. Setup must therefore provision the venv
        # and exit 0 even with no CLI installed (runners have none).
        run: |
          set -e
          if command -v brightdata >/dev/null 2>&1; then
            echo "note: brightdata unexpectedly present; skipping the absent-CLI assertion"
            exit 0
          fi
          ./setup.sh --no-prompt
          test -x .venv/bin/python
          echo "OK: setup.sh succeeded (venv provisioned) without the Bright Data CLI"

  # Single required check for branch protection. Adding a job above does not mean
  # remembering to add it to the protection rule -- it only needs listing here.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - repo-hygiene
      - installers
      - deep-research
      - garmin
      - gpt-image-2
      - humanize
      - pst-to-markdown
      - pst-to-markdown-install
      - smoke
    steps:
      - name: Fail if any job did not succeed
        # `needs.*.result` is 'success', 'failure', 'cancelled' or 'skipped'.
        # contains() over the whole set catches every non-success in one check.
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job reported '$r'"
              exit 1
            fi
          done
          echo "all required jobs succeeded"
