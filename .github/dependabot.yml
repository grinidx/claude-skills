version: 2

# Known limitation, accepted rather than worked around: the five pip manifests
# below use open ranges (`PyYAML>=6.0`, `requests>=2.28`). Dependabot generally
# leaves `>=` constraints alone, because a new release already satisfies them --
# so those ecosystems will be quiet until something is actually pinned. They are
# listed anyway: they cost nothing, and they start working the moment a pin
# appears (garmin's requirements.txt is the likeliest first case).
#
# github-actions is where the value is today. CI pins every action to a commit
# SHA, which is only safe if something keeps the pins current; that something is
# this file.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
    groups:
      # One PR for all action bumps rather than one per action. The CI matrix is
      # the test, and it runs the same either way.
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /garmin
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps(garmin)"
    groups:
      garmin:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /gpt-image-2
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps(gpt-image-2)"
    groups:
      gpt-image-2:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /verve
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps(verve)"
    ignore:
      # requests 2.33+ declares Requires-Python >=3.10, and this skill's CI
      # floor is 3.9, so the bump fails at pip install rather than at test time.
      # It also buys nothing: requirements.txt states a floor, not a pin, so the
      # 3.13 job already installs the current release under `requests>=2.32.4`.
      # PR #19 set that floor for this reason and #22 re-proposed the same bump.
      # Bounded at 2.33 so a 2.32.x security patch still comes through.
      - dependency-name: requests
        versions: [">=2.33"]
    groups:
      verve:
        patterns:
          - "*"
